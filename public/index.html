<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pi · Music</title>
<style>
:root{
  --bg:#0a0c0f; --panel:#12151a; --panel2:#181c23; --line:#242a33; --text:#f2f4f7; --dim:#97a0ad; --faint:#5d6674;
  --accent:#1ed760; --accent-ink:#04120a; --warn:#ffb020; --bad:#ff5d5d;
  --rail:92px; --r:16px; --tap:56px;
  font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
svg{width:1em;height:1em;fill:currentColor;display:block}
#app{height:100%;display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:1fr auto}
/* rail */
#rail{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0;gap:6px}
.nav{width:76px;height:76px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:12px;letter-spacing:.02em}
.nav svg{font-size:28px}
.nav[aria-current=true]{background:var(--panel2);color:var(--text)}
.nav[aria-current=true] svg{color:var(--accent)}
#rail .grow{flex:1}
#chip{width:76px;text-align:center;font-size:11px;color:var(--dim);line-height:1.25;padding:8px 4px;border-radius:12px}
#chip i{display:block;width:10px;height:10px;border-radius:50%;margin:0 auto 6px;background:var(--faint)}
#chip.ok i{background:var(--accent);box-shadow:0 0 12px var(--accent)}
#chip.tap{cursor:pointer;background:var(--panel2)}
#chip.warn i{background:var(--warn)} #chip.bad i{background:var(--bad)}
/* views */
main{position:relative;min-height:0;overflow:hidden}
.view{overscroll-behavior:contain;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:28px 36px 36px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
h1{font-size:30px;margin:0 0 18px;letter-spacing:-.01em}
h2{font-size:19px;margin:28px 0 12px;color:var(--text)}
.sub{color:var(--dim)}
.btn{height:var(--tap);padding:0 24px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;display:inline-flex;align-items:center;gap:10px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn svg{font-size:22px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{height:48px;padding:0 22px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-weight:600}
.tab[aria-selected=true]{background:var(--text);color:#000;border-color:transparent}
/* art */
.art{background:#222 center/cover no-repeat;border-radius:12px;aspect-ratio:1;flex:none}
/* now playing */
#v-now{padding:0;overflow:hidden}
/* blur a tiny copy and scale it up: same look, a fraction of the GPU/CPU cost of blur(70px) on a full-screen layer */
#nowbg{position:absolute;left:0;top:0;width:12.5%;height:12.5%;background:center/cover no-repeat;transform:scale(8);transform-origin:0 0;filter:blur(8px) saturate(1.4);opacity:.38}
#nowwrap{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:5vw;align-items:center;padding:3vh 5vw}
#bigart{width:100%;max-width:min(62vh,100%);justify-self:end;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#info{max-width:640px;min-width:0}
#t-title{font-size:clamp(28px,4.2vh,46px);font-weight:750;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#t-artist{font-size:clamp(18px,2.6vh,26px);color:var(--text);opacity:.88}
#t-album{font-size:16px;color:var(--dim);margin-top:4px}
#t-ctx{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.link{cursor:pointer}.link:active{opacity:.6}
.seek{margin:34px 0 8px;touch-action:none}
.bar{touch-action:none;position:relative;height:44px;display:flex;align-items:center;cursor:pointer}
.bar::before{content:"";position:absolute;left:0;right:0;height:6px;border-radius:3px;background:rgba(255,255,255,.16)}
.bar .fill{position:absolute;left:0;height:6px;border-radius:3px;background:var(--text);width:100%;transform:scaleX(0);transform-origin:0 50%;will-change:transform}
.bar .knob{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;margin-left:-10px;left:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.times{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:-6px}
.transport{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;max-width:520px}
.ic{width:var(--tap);height:var(--tap);border-radius:50%;display:grid;place-items:center;font-size:30px;color:var(--text)}
.ic:active{background:rgba(255,255,255,.1)}
.ic.on{color:var(--accent)}
.ic.big{width:84px;height:84px;background:var(--text);color:#000;font-size:40px}
.ic.big:active{background:#cfd3d9}
.ic.sm{font-size:24px}
.vol{display:flex;align-items:center;gap:14px;max-width:520px}
.vol .bar{flex:1}
.vol svg{font-size:26px;color:var(--dim)}
.extras{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
#pair{display:none;margin-top:24px;padding:18px 20px;border-radius:var(--r);background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:#ffd88a;font-size:16px;line-height:1.45}
/* queue drawer */
#queue{position:absolute;top:0;right:0;bottom:0;width:min(440px,92%);background:rgba(14,17,21,.97);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s;z-index:5;display:flex;flex-direction:column}
#queue.open{transform:none}
#queue header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
#queue header b{font-size:19px}
#qlist{overflow-y:auto;padding:0 12px 20px;flex:1}
/* mini player */
#mini{grid-column:2;display:none;align-items:center;gap:16px;height:84px;padding:0 20px;background:var(--panel);border-top:1px solid var(--line);position:relative}
#mini.on{display:flex;touch-action:pan-y;overflow:hidden}
#mini .art,#mini .txt{will-change:transform}
#mini.snap .art,#mini.snap .txt{transition:transform .2s ease,opacity .2s ease}
#mini .art{width:56px;height:56px}
#mini .txt{flex:1;min-width:0}
#mini .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .a{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .prog{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:100%;transform:scaleX(0);transform-origin:0 50%}
/* lists */
.row{content-visibility:auto;contain-intrinsic-size:auto 72px;display:flex;align-items:center;gap:16px;min-height:72px;padding:8px 12px;border-radius:14px;cursor:pointer}
.row:active{background:var(--panel2)}
.row[data-tr]{touch-action:pan-y;transition:transform .18s ease}
.row.swiping{transition:none;position:relative;content-visibility:visible}
#swipehint{position:fixed;display:none;z-index:15;align-items:center;border-radius:14px;overflow:hidden;background:rgba(30,215,96,.22);color:var(--accent);pointer-events:none;padding:0 22px}
#swipehint.armed{background:var(--accent);color:var(--accent-ink)}
#swipehint svg{font-size:30px;transition:transform .12s}
#swipehint.armed svg{transform:scale(1.3)}
.row .art{width:56px;height:56px;border-radius:8px}
.row .txt{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .d{color:var(--faint);font-variant-numeric:tabular-nums;font-size:14px}
.row.cur .t{color:var(--accent)}
.row .num{width:28px;text-align:center;color:var(--faint);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:22px}
.card{cursor:pointer;min-width:0;contain:layout paint}
.card .art{width:100%;margin-bottom:10px}
.card .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:active{opacity:.7}
.card.round .art{border-radius:50%}
.head{display:flex;gap:28px;align-items:flex-end;margin-bottom:22px}
.head .art{width:200px;height:200px;border-radius:14px}
.head h1{margin:6px 0 8px}
.actions{display:flex;gap:12px;margin:18px 0 8px;flex-wrap:wrap}
.back{margin-bottom:14px;color:var(--dim);display:inline-flex;align-items:center;gap:6px;height:44px;font-weight:600}
.back svg{font-size:22px}
.note{padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:15px;line-height:1.45;margin:10px 0}
.empty{color:var(--faint);padding:40px 0;text-align:center}
/* search */
#sbox{display:flex;gap:12px;align-items:center;height:64px;padding:0 22px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin-bottom:14px}
#sbox svg{font-size:26px;color:var(--dim)}
#q{flex:1;background:none;border:0;outline:0;font-size:22px;user-select:text;-webkit-user-select:text;min-width:0}
#osk{display:none;margin:0 0 20px;padding:12px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line)}
#osk.on{display:block}
.krow{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.krow:last-child{margin:0}
.key{height:54px;min-width:58px;flex:1;max-width:84px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px;font-weight:600}
.key:active{background:#2a313c}.key.w{max-width:none;flex:3}.key.a{background:var(--accent);color:var(--accent-ink)}
/* video */
#v-video{display:none;padding:0}
#v-video.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 30px}
#vbox{position:relative;width:min(100%,calc((100vh - 220px) * 16 / 9));aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#vbox iframe,#vbox #ytp{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#vmsg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:30px;color:var(--dim);font-size:18px;line-height:1.5;background:#0d0f12}
#vbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--dim);font-size:15px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#e9ecf1;color:#000;padding:12px 20px;border-radius:999px;font-weight:600;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
#v-podcasts .grid,#pod .grid{margin-top:4px}
.fsearch{display:flex;align-items:center;gap:12px;height:56px;padding:0 8px 0 18px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);margin:6px 0 12px}
.fsearch svg{font-size:22px;color:var(--dim)}
.fsearch input{flex:1;background:none;border:0;outline:0;font-size:18px;min-width:0;user-select:text;-webkit-user-select:text}
.fsearch .sub{font-size:14px}
.row.played .t{color:var(--dim)}
#v-settings h1{margin-top:4px}
@media (max-height:700px){.nav{width:64px;height:60px;font-size:11px;gap:3px}.nav svg{font-size:24px}#chip{padding:4px}}
@media (max-width:900px){
  :root{--rail:76px}
  #nowwrap{grid-template-columns:1fr;grid-auto-rows:min-content;overflow-y:auto;align-content:start;padding:20px}
  #bigart{max-width:60vw;justify-self:center}
  .nav{width:64px;height:64px}#chip{width:64px}
}
@media (max-height:640px){#bigart{max-width:52vh}.seek{margin-top:16px}.transport{margin:4px 0}}

/* ===== pager, home dashboard, screensaver ===== */
#pager{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#track{display:flex;width:200vw;height:100%;will-change:transform;transform:translate3d(0,0,0)}
#track.anim{transition:transform .38s cubic-bezier(.22,.8,.24,1)}
#home,#spotpage{flex:0 0 100vw;width:100vw;height:100%;position:relative;overflow:hidden}
#home.off,#spotpage.off{visibility:hidden}
#spotpage>#app,#hwrap{translate:var(--sx,0px) var(--sy,0px);transition:translate 10s ease-in-out}
#rail,#mini{transition:opacity 1.5s ease;touch-action:pan-y}
#home{touch-action:pan-y;background:radial-gradient(1400px 800px at 12% -10%,#16202e 0%,var(--bg) 62%)}
#hwrap{position:absolute;inset:0;padding:clamp(14px,2vw,34px);display:grid;gap:clamp(12px,1.3vw,20px);grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"clock weather weather" "cal cal todo"}
.w{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:clamp(14px,1.5vw,24px);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.w h3{margin:0 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:650;display:flex;justify-content:space-between;align-items:center}
.w h3 span{letter-spacing:.02em;text-transform:none;color:var(--faint);font-weight:500}
#w-clock{grid-area:clock;justify-content:center}
#clk{font-size:clamp(60px,8vw,148px);font-weight:300;letter-spacing:-.035em;line-height:.95;font-variant-numeric:tabular-nums}
#date{font-size:clamp(17px,1.7vw,30px);color:var(--dim);margin-top:10px}
#next{font-size:clamp(14px,1.2vw,19px);color:var(--text);margin-top:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#next b{color:var(--accent);font-weight:650}
#w-weather{grid-area:weather;gap:0}
#wx-top{display:flex;gap:clamp(14px,2vw,34px);align-items:center;flex:1;min-height:0}
#wx-now{display:flex;align-items:center;gap:clamp(10px,1.2vw,20px);flex:0 0 auto}
#wx-now .ico{width:clamp(64px,6.4vw,112px);height:clamp(64px,6.4vw,112px)}
#wx-temp{font-size:clamp(46px,5.4vw,96px);font-weight:300;letter-spacing:-.03em;line-height:1}
#wx-desc{font-size:clamp(15px,1.4vw,22px);font-weight:600}
#wx-sub{font-size:clamp(12px,1vw,15px);color:var(--dim);margin-top:4px;line-height:1.5}
#wx-days{display:flex;flex:1;gap:6px;justify-content:space-between;min-width:0}
.wd{flex:1;text-align:center;padding:8px 2px;border-radius:14px;background:var(--panel2);font-size:clamp(11px,.95vw,14px);color:var(--dim);min-width:0}
.wd .ico{width:clamp(26px,2.6vw,40px);height:clamp(26px,2.6vw,40px);margin:4px auto}
.wd b{color:var(--text);font-weight:600}
#wx-hours{display:flex;gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.wh{flex:1;text-align:center;font-size:clamp(11px,.95vw,14px);color:var(--dim);min-width:0}
.wh .ico{width:clamp(22px,2.1vw,32px);height:clamp(22px,2.1vw,32px);margin:3px auto}
.wh b{display:block;color:var(--text);font-weight:600;font-size:1.1em}
.wh i{font-style:normal;color:#6db8ff;font-size:.95em;display:block;min-height:1.2em}
.attr{font-size:10px;color:var(--faint);margin-top:8px;text-align:right}
.ico{display:block}
#w-cal{grid-area:cal}
#w-todo{grid-area:todo}
.scroll{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;scrollbar-width:none;overscroll-behavior:contain;margin:0 -6px;padding:0 6px}
.scroll::-webkit-scrollbar{display:none}
.dl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:650;margin:14px 0 6px}
.dl:first-child{margin-top:0}
.ev{display:flex;gap:12px;align-items:stretch;padding:9px 10px;border-radius:12px;margin-bottom:4px}
.ev .tm{width:64px;flex:none;font-variant-numeric:tabular-nums;color:var(--dim);font-size:15px;padding-top:1px}
.ev .bar{width:4px;border-radius:2px;flex:none}
.ev .tx{min-width:0;flex:1}
.ev .tt{font-weight:600;font-size:clamp(15px,1.25vw,19px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .lc{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{opacity:.42}
.ev.now{background:var(--panel2)}

/* 3-day calendar */
#w-cal{padding-bottom:clamp(8px,.9vw,14px)}
#cal-head{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:0;margin:0 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
#cal-head .dh{padding:0 6px;text-align:left;min-width:0}
#cal-head .dn{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:650;display:flex;align-items:baseline;gap:7px}
#cal-head .dn b{font-size:clamp(20px,1.9vw,30px);font-weight:500;letter-spacing:-.02em;color:var(--text);line-height:1}
#cal-head .dh.today .dn{color:var(--accent)}
#cal-head .dh.today .dn b{background:var(--accent);color:#04120a;border-radius:999px;padding:3px 10px;font-weight:650}
#cal-head .ad{margin-top:6px;display:flex;flex-direction:column;gap:3px;min-height:0}
#cal-head .ad div{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 30%,var(--panel));border-left:3px solid var(--c)}
#cal-head .ad i{font-style:normal;font-size:11px;color:var(--faint);padding-left:4px}
#cal-list{margin-top:0}
.cg{position:relative;display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));height:calc(var(--hh) * 24)}
.cg .hr{position:absolute;left:0;width:44px;font-size:11px;color:var(--faint);text-align:right;padding-right:8px;font-variant-numeric:tabular-nums;transform:translateY(-7px)}
.cg .dc{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),rgba(255,255,255,.055) calc(var(--hh) - 1px),rgba(255,255,255,.055) var(--hh))}
.cg .dc.today{background-color:rgba(255,255,255,.028)}
.ce{position:absolute;box-sizing:border-box;border-radius:8px;padding:3px 7px;overflow:hidden;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--panel));color:var(--text);min-width:0}
.ce .t{font-size:clamp(12px,1vw,15px);font-weight:620;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.ce .m{font-size:11px;color:var(--dim);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ce.past{opacity:.42}
.ce.now{box-shadow:0 0 0 1.5px var(--c)}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid #ff5d5d;z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#ff5d5d}
#next.none{color:var(--faint)}
#cal-today{background:var(--accent);color:#04120a;font:inherit;font-size:12px;font-weight:700;letter-spacing:.04em;border:0;border-radius:999px;padding:5px 13px;margin-right:10px;cursor:pointer}
#cal-today[hidden]{display:none}
#cal-head,#cal-list .cg{will-change:transform}
.nowchip{position:absolute;left:2px;width:40px;text-align:center;font-size:11px;font-weight:700;color:#fff;background:#ff5d5d;border-radius:6px;padding:1px 0;transform:translateY(-50%);z-index:4;pointer-events:none;font-variant-numeric:tabular-nums}
.empty2{color:var(--faint);padding:14px 4px;font-size:15px;line-height:1.5}
.td{display:flex;align-items:center;gap:14px;padding:6px 4px;border-radius:12px;transition:opacity .35s,transform .35s,max-height .4s;max-height:90px;overflow:hidden}
.td.done{opacity:0;transform:translateX(30px);max-height:0;padding:0}
.chk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--faint);flex:none;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.chk svg{font-size:24px}
.chk.p4{border-color:#ff5d5d}.chk.p3{border-color:#ffa13d}.chk.p2{border-color:#4da3ff}
.td.done .chk{background:var(--accent);border-color:var(--accent);color:#04120a}
.td .tx{min-width:0;flex:1}
.td .tt{font-size:clamp(15px,1.25vw,19px);font-weight:550;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.td .tg{font-size:12px;color:var(--dim);margin-top:2px}
.td .tg.od{color:#ff7a7a}
#dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;z-index:5}
#dots.hide{display:none}
#dots button{width:34px;height:30px;display:grid;place-items:center}
#dots i{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:all .2s}
#dots button[aria-current=true] i{background:var(--text);width:22px;border-radius:4px}
#hgear{position:absolute;right:14px;bottom:2px;width:44px;height:36px;display:grid;place-items:center;color:var(--faint);font-size:22px;z-index:5}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;z-index:50}
body.ambient #dim{opacity:.3}
body.ambient #rail,body.ambient #mini{opacity:0}
#saver{position:fixed;inset:0;z-index:100;background:#000;display:none;overflow:hidden;touch-action:none}
#saver.on{display:block}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 2.5s ease}
.slide.show{opacity:1}
.slide .bg{position:absolute;inset:-6%;background-size:cover;background-position:center;filter:blur(38px) brightness(.55);display:none}
.slide.portrait .bg{display:block}
.slide .fg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.slide.portrait .fg{background-size:contain}
#sclock{position:absolute;z-index:2;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.7);font-weight:300;font-size:clamp(34px,4.2vw,76px);letter-spacing:-.02em;padding:26px 38px;line-height:1.05;font-variant-numeric:tabular-nums}
#sclock small{display:block;font-size:.3em;font-weight:500;letter-spacing:.02em;opacity:.9;margin-top:4px}
#sclock.tl{top:0;left:0}#sclock.tr{top:0;right:0;text-align:right}#sclock.bl{bottom:0;left:0}#sclock.br{bottom:0;right:0;text-align:right}
#snone{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--dim);font-size:18px;line-height:1.6;background:radial-gradient(900px 600px at 50% 40%,#1a2433,#07090c)}
#snone.on{display:grid}

/* ===== sleep veil + alarm ===== */
#veil{position:fixed;inset:0;background:#000;z-index:400;display:none;cursor:none;touch-action:none}
#veil.on{display:block}
#alarm{position:fixed;inset:0;z-index:300;display:none;place-items:center;text-align:center;background:linear-gradient(180deg,#141b33 0%,#2b2a4e 48%,#5d4458 100%);touch-action:none}
#alarm.on{display:grid;animation:aIn 2.5s ease both}
@keyframes aIn{from{opacity:0}to{opacity:1}}
#alarm::before{content:'';position:absolute;left:50%;bottom:-30%;width:120vw;height:70vh;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(255,196,120,.38),transparent);animation:glow 9s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55}to{opacity:1}}
#alarm .am{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 5vw}
#al-time{font-size:clamp(90px,16vw,260px);font-weight:200;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
#al-date{font-size:clamp(20px,2.4vw,40px);color:#d9d3ea;margin-top:10px}
#al-line{font-size:clamp(16px,1.7vw,26px);color:#f1d9b8;margin-top:22px;min-height:1.4em}
#al-slide{position:relative;margin-top:clamp(40px,8vh,90px);width:min(620px,84vw);height:88px;border-radius:44px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);overflow:hidden;touch-action:none}
#al-slide span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;letter-spacing:.04em;color:#e8e2f5;padding-left:60px;pointer-events:none}
#al-knob{position:absolute;left:6px;top:6px;width:76px;height:76px;border-radius:50%;background:#fff;color:#2b2a4e;display:grid;place-items:center;font-size:40px;cursor:grab;will-change:transform}
</style>

'use strict';
/* ============ utilities ============ */
const $ = (s, r = document) => r.querySelector(s);

const IC = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>', pause: '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>',

  heart: '<svg viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3m-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05"/></svg>',

let toastT; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400); };
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const ph = key => `linear-gradient(135deg,hsl(${hue(key)} 45% 32%),hsl(${(hue(key) + 50) % 360} 50% 18%))`;
const setArt = (el, url, key) => { el.style.backgroundImage = url ? `url("${url}")` : ph(key || 'x'); };
const artStyle = (url, key) => `style="background-image:${url ? `url('${esc(url)}')` : ph(key || 'x')}"`;

/* ============ Spotify Web API (via our server) ============ */
const web = { local: false, loggedIn: false, clientIdSet: false, ytKey: false, demo: false };
async function api(path, opts = {}) {
  const r = await fetch('/api/spotify/' + path, { ...opts, headers: { 'X-Dash': '1', ...(opts.headers || {}) } });
  if (r.status === 401) { web.loggedIn = false; throw Object.assign(new Error('login'), { code: 401 }); }
  if (!r.ok) throw Object.assign(new Error('http ' + r.status), { code: r.status });
  const t = await r.text(); return t ? JSON.parse(t) : {};
}
// Recently-played ordering for tiles (playlists, albums, podcasts). Server merges what this
// dashboard has played with Spotify's own recently-played history.
let recent = {}, recentAt = 0;
async function loadRecent(force) {
  if (!force && Date.now() - recentAt < 15000) return;
  try { recent = await (await fetch('/api/recent')).json(); recentAt = Date.now(); } catch {}
}
const byRecent = (list, uri) => list.map((x, i) => [x, i]).sort((a, b) => (recent[uri(b[0])] || 0) - (recent[uri(a[0])] || 0) || a[1] - b[1]).map(x => x[0]);
const oeCache = {};
async function oembed(uri) {
  if (uri in oeCache) return oeCache[uri];
  try { const r = await (await fetch('/api/oembed?uri=' + encodeURIComponent(uri))).json(); oeCache[uri] = r.title ? r : null; } catch { oeCache[uri] = null; }
  return oeCache[uri];
}
// Playlists you've played (anywhere) that Spotify's library listing doesn't return, e.g. Spotify-made mixes.
let pins = [], mineSet = new Set();
async function loadPins() { try { pins = await (await fetch('/api/pins')).json(); } catch {} }
async function pinApi(method, body) { const r = await fetch('/api/pins', { method, headers: { 'X-Dash': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json(); if (Array.isArray(j.pins)) pins = j.pins; return j; }
async function extraPlaylists(have) {
  const seen = Object.keys(recent).filter(u => u.startsWith('spotify:playlist:') && !pins.includes(u)).sort((a, b) => recent[b] - recent[a]).slice(0, 30);
  const uris = [...pins, ...seen].filter(u => !have.has(u));
  const metas = await Promise.all(uris.map(oembed));
  return uris.map((u, i) => metas[i] && { id: trackId(u), uri: u, name: metas[i].title, owner: { display_name: pins.includes(u) ? 'Pinned' : 'From your listening' }, images: metas[i].thumbnail_url ? [{ url: metas[i].thumbnail_url, width: 300 }] : [] }).filter(Boolean);
}
let noted = '';
function noteContext() {
  if (S.status !== 'playing') return;
  const uris = [], c = S.context, par = S.item?.decorations?.parent?.entity;
  if (c?.uri && /^spotify:(playlist|album|show):/.test(c.uri)) uris.push(c.uri);
  if (S.item?.entity_type === 'episode' && par?.uri?.startsWith('spotify:show:')) uris.push(par.uri);
  const key = uris.join('|'); if (!key || key === noted) return; noted = key;
  uris.forEach(u => { recent[u] = Date.now(); fetch('/api/played', { method: 'POST', headers: { 'X-Dash': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ uri: u }) }).catch(() => {}); });
}
// Spotify returns at most 50 items per request, so walk the pages.
async function all(path, cap = 2000) {

const epRow = e => {
  const rp = e.resume_point || {}, left = (e.duration_ms || 0) - (rp.resume_position_ms || 0);
  const st = rp.fully_played ? ' · Played' : (rp.resume_position_ms > 1000 ? ` · ${Math.max(1, Math.round(left / 60000))} min left` : '');
  return `<div class="row ${rp.fully_played ? 'played' : ''}" data-tr="${esc(e.uri)}" data-s="${esc(((e.name || '') + ' ' + (e.description || '').slice(0, 200)).toLowerCase())}"><div class="art" ${artStyle(img(e.images, 64), e.uri)}></div><div class="txt"><div class="t">${esc(e.name)}</div><div class="a">${esc(e.release_date || '')} · ${Math.round((e.duration_ms || 0) / 60000)} min${st}</div></div><div class="d">${fmt(e.duration_ms)}</div></div>`;
};
const card = (kind, id, title, subtitle, images, round) => `<div class="card ${round ? 'round' : ''}" data-open="${kind}:${esc(id)}"><div class="art" ${artStyle(img(images, 300), kind + id)}></div><div class="t">${esc(title)}</div><div class="a">${esc(subtitle)}</div></div>`;

// on-screen keyboard (one instance; moves next to whichever input asked for it)
(function osk() {
  const rows = ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  const el = $('#osk'); let target = null;
  el.innerHTML = rows.map((r, i) => `<div class="krow">${[...r].map(c => `<button class="key" data-k="${c}">${c}</button>`).join('')}${i === 3 ? '<button class="key" data-k="BS" aria-label="Backspace">⌫</button>' : ''}</div>`).join('') + '<div class="krow"><button class="key" data-k="&#39;">\'</button><button class="key w" data-k=" ">space</button><button class="key" data-k="CLR">clear</button><button class="key a" data-k="GO">Done</button></div>';
  el.addEventListener('pointerdown', e => e.preventDefault());
  el.addEventListener('click', e => {
    const k = e.target.closest('[data-k]')?.dataset.k; if (!k || !target) return;
    if (k === 'GO') { if (target.id === 'q') { clearTimeout(sT); doSearch(); } hideOsk(); return; }
    target.value = k === 'BS' ? target.value.slice(0, -1) : k === 'CLR' ? '' : target.value + k;
    target.dispatchEvent(new Event('input', { bubbles: true }));
  });
  window.showOsk = (input, anchor) => { if (el.classList.contains('on') && target === input) { hideOsk(); return; } target = input; anchor.insertAdjacentElement('afterend', el); el.classList.add('on'); };
  window.hideOsk = () => { el.classList.remove('on'); document.body.appendChild(el); };
})();

/* ============ music video (official video, muted, locked to Soloist's clock) ============ */
let yt = null, ytReady = false, vidFor = '', vidId = '', vidOn = false, syncT = 0;
const offKey = () => 'voff:' + (S.item?.uri || '');
const vOff = () => +(localStorage.getItem(offKey()) || 0);
function vmsg(t) { const m = $('#vmsg'); m.style.display = t ? 'grid' : 'none'; m.innerHTML = t || ''; }
function loadYT(cb) {
  if (window.YT?.Player) return cb();
  window.onYouTubeIframeAPIReady = cb;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => vmsg('Could not reach YouTube. Check the Pi has internet.'); document.head.appendChild(s);
}
async function startVideo() {
  vidOn = true; $('#v-video').classList.add('on'); updateVideo();
  clearInterval(syncT); syncT = setInterval(syncVideo, 2000);
}
function pauseVideoView() { vidOn = false; clearInterval(syncT); try { yt?.pauseVideo(); } catch {} }
async function updateVideo() {
  if (!vidOn) return;
  const i = info(S.item);
  if (!i || i.type !== 'track') { vmsg('Play a song to see its music video here.'); $('#vtitle').textContent = ''; return; }
  if (vidFor === i.uri && vidId) { vmsg(''); return; }
  vidFor = i.uri; vidId = ''; vmsg('Finding the official video…'); $('#vtitle').textContent = '';
  const q = i.artists.map(a => a.name).join(' ') + ' ' + i.title;
  try {
    const r = await (await fetch('/api/video?q=' + encodeURIComponent(q))).json();
    if (vidFor !== i.uri) return;
    if (r.error === 'no_key') { vmsg('Add a free YouTube Data API key (<code>YOUTUBE_API_KEY</code>) to find videos.'); return; }
    if (!r.id) { vmsg('No video found for this track.'); return; }
    vidId = r.id; $('#vtitle').textContent = r.title || ''; vmsg('');
    loadYT(() => {
      const opts = { videoId: r.id, playerVars: { controls: 0, disablekb: 1, modestbranding: 1, rel: 0, iv_load_policy: 3, playsinline: 1, mute: 1, autoplay: 1, fs: 0 }, events: { onReady: () => { ytReady = true; yt.mute(); syncVideo(true); }, onError: () => vmsg('This video cannot be embedded. It may be blocked by the uploader.') } };
      if (yt && ytReady) { yt.loadVideoById(r.id); setTimeout(() => syncVideo(true), 600); } else if (!yt) yt = new YT.Player('ytp', opts);
    });
    updateOff();
  } catch { vmsg('Video lookup failed.'); }
}
function syncVideo(force) {
  if (!vidOn || !ytReady || !vidId) return;
  if (S.item && vidFor !== S.item.uri) { updateVideo(); return; }
  try {
    yt.mute();
    const want = Math.max(0, curMs() / 1000 + vOff()), have = yt.getCurrentTime(), st = yt.getPlayerState();
    if (S.status === 'playing') { if (st !== 1 && st !== 3) yt.playVideo(); if (force || Math.abs(have - want) > 1.2) yt.seekTo(want, true); }
    else { if (st === 1) yt.pauseVideo(); if (Math.abs(have - want) > 0.6) yt.seekTo(want, true); }
  } catch {}
}
function updateOff() { $('#voff').textContent = 'sync ' + (vOff() >= 0 ? '+' : '') + vOff().toFixed(1) + 's'; }
const nudge = d => { localStorage.setItem(offKey(), (vOff() + d).toFixed(1)); updateOff(); syncVideo(true); };
$('#v-m').onclick = () => nudge(-.5); $('#v-p').onclick = () => nudge(.5);
$('#v-fs').onclick = () => { const b = $('#vbox'); document.fullscreenElement ? document.exitFullscreen() : b.requestFullscreen?.(); };
const _render = render; render = function () { _render(); if (vidOn) updateVideo(); };

}

function mkSlide() { const d = document.createElement('div'); d.className = 'slide'; d.innerHTML = '<div class="bg"></div><div class="fg"></div>'; $('#saver').insertBefore(d, $('#snone')); return d; }
async function showPhoto(first) {
  if (!saver.list.length) return;
  const name = await nextPhoto(); if (!name) return; const url = '/photos/' + name;
  const img = new Image(); img.decoding = 'async'; img.src = url;
  try { await img.decode(); } catch { return; }
  if (!saver.on) return;
  const old = saver.layers[saver.cur], nx = saver.layers[1 - saver.cur] || (saver.layers[1 - saver.cur] = mkSlide());
  nx.classList.toggle('portrait', img.naturalHeight > img.naturalWidth * 1.05);
  nx.querySelector('.fg').style.backgroundImage = nx.querySelector('.bg').style.backgroundImage = `url("${url}")`;
  if (first) nx.style.transition = 'none';
  nx.classList.add('show'); if (old && old !== nx) old.classList.remove('show');
  if (first) requestAnimationFrame(() => requestAnimationFrame(() => nx.style.transition = ''));
  saver.cur = 1 - saver.cur;
  const corners = ['bl', 'tr', 'br', 'tl']; $('#sclock').className = corners[saver.corner++ % 4];
}
async function showSaver() {
  if (saver.on) return;
  saver.on = true; setAmbient(false);
  await refreshDeck(); saver.list = [...deckKnown];
  saver.i = 0; $('#saver').classList.add('on'); updSaverClock();
  const none = $('#snone'); none.classList.toggle('on', !saver.list.length);
  if (!saver.list.length) none.innerHTML = 'No photos yet.<br>Add some from your phone:<br><b>' + (web.lan?.[0] ? `http://${web.lan[0]}:${web.port}/photos.html` : 'open /photos.html on the Pi’s address') + '</b>';
  saver.layers.forEach(l => l.classList.remove('show'));
  await showPhoto(true);
  clearInterval(saver.timer);
  saver.timer = setInterval(() => showPhoto(false), Math.max(1, H.cfg?.saver?.photoMin || 5) * 60e3);
}
function hideSaver() { if (!saver.on) return; if (calOff) calGo(0); saver.on = false; clearInterval(saver.timer); $('#saver').classList.remove('on'); }
$('#saver').addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation();
  hideSaver(); PG.sup = performance.now() + 400; lastAct = Date.now(); setPage(0, false);
});

/* ---- idle handling + anti burn-in ---- */
let lastAct = Date.now(), ambient = false;
for (const t of ['pointerdown', 'pointermove', 'keydown', 'wheel']) addEventListener(t, () => { lastAct = Date.now(); if (ambient) setAmbient(false); }, { capture: true, passive: true });
function setAmbient(on) { if (ambient === on) return; ambient = on; document.body.classList.toggle('ambient', on); shiftPx(); }
const playingHere = () => !!(S.bridge && S.auth?.is_active && S.status === 'playing');
setInterval(() => {
  if (PW.sleeping || PW.alarmActive) return;
  const lim = (H.cfg?.saver?.idleMin || 3) * 60e3, here = playingHere();
  if (saver.on) { if (here) { hideSaver(); setPage(1, false); go('now'); } return; }   // music started on the Pi: show it instead of photos
  if (Date.now() - lastAct < lim) return;
  if (here) { if (!ambient) { if (route.view !== 'video') go('now'); if (PG.page !== 1) setPage(1); setAmbient(true); } }
  else showSaver();
}, 3000);
// pixel shift: nudge the whole UI a few px every minute (every 20s when in ambient music mode) so no edge stays on the same pixels
let shiftT = 0;
function shiftPx() {
  const m = ambient ? 8 : 5, r = () => Math.round((Math.random() * 2 - 1) * m);
  document.documentElement.style.setProperty('--sx', r() + 'px'); document.documentElement.style.setProperty('--sy', r() + 'px');
  clearTimeout(shiftT); shiftT = setTimeout(shiftPx, ambient ? 20e3 : 60e3);
}


/* ============ sleep (screen off overnight) + alarm ============ */
const PW = { sleeping: false, alarmActive: false };
async function pollPower() { try { applyPower(await jget('/api/power')); } catch {} }
function applyPower(p) {
  if (p.sleeping !== PW.sleeping) {
    PW.sleeping = p.sleeping; $('#veil').classList.toggle('on', p.sleeping);
    if (p.sleeping) { hideSaver(); setPage(0, false); setAmbient(false); }
    else { lastAct = Date.now(); setPage(0, false); refreshHome(); }
  }
  if (p.alarmActive !== PW.alarmActive) { PW.alarmActive = p.alarmActive; p.alarmActive ? startAlarm() : stopAlarm(); }
}
$('#veil').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); });

/* ---- alarm sound: slow, soft bell phrases over a quiet pad, ramping up gently. Pure Web Audio, no files. ---- */
const AL = { ctx: null, timer: 0, master: null, nodes: [] };
function impulse(ctx, secs, decay) { const n = ctx.sampleRate * secs | 0, b = ctx.createBuffer(2, n, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); } return b; }
function startAlarm() {
  updAlarmText(); $('#alarm').classList.add('on'); hideSaver();
  try {
    const ctx = AL.ctx || (AL.ctx = new (window.AudioContext || window.webkitAudioContext)()); ctx.resume?.();
    // volume 1-100 -> master gain 0.2..1.0 (quiet end still audible); rises to full over ~20 s so it wakes you gently but isn't lost in the 2-minute window
    const vol = Math.max(1, Math.min(100, H.cfg?.alarm?.volume ?? 70)) / 100, target = 0.2 + 0.8 * vol, t0 = ctx.currentTime;
    const master = ctx.createGain(); master.gain.setValueAtTime(target * 0.45, t0); master.gain.linearRampToValueAtTime(target, t0 + 20);
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; master.connect(comp); comp.connect(ctx.destination);
    const rev = ctx.createConvolver(); rev.buffer = impulse(ctx, 2.6, 2.2); const wet = ctx.createGain(); wet.gain.value = 0.35; rev.connect(wet); wet.connect(master);
    AL.master = master; AL.nodes = [master, comp, rev, wet];
    // warm music-box chime: a few decaying partials per note, soft but clear
    const chime = (f, when, gain, dur = 2.2) => {
      const e = ctx.createGain(); e.gain.setValueAtTime(0, when); e.gain.linearRampToValueAtTime(gain, when + 0.008); e.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      [[1, 1], [2, 0.38], [3.01, 0.16], [4.2, 0.07]].forEach(([m, g]) => { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine'; o.frequency.value = f * m; og.gain.value = g; o.connect(og); og.connect(e); o.start(when); o.stop(when + dur + 0.1); });
      e.connect(master); e.connect(rev);
    };
    const pad = when => [130.81, 196, 261.63, 329.63, 392].forEach(f => { // C major 9-ish swell underneath
      const o = ctx.createOscillator(), e = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f;
      e.gain.setValueAtTime(0, when); e.gain.linearRampToValueAtTime(0.07, when + 3); e.gain.linearRampToValueAtTime(0, when + 9);
      o.connect(e); e.connect(master); e.connect(rev); o.start(when); o.stop(when + 9.2);
    });
    // C major pentatonic motifs that repeat, so it feels like a tune rather than random notes
    const C5 = 523.25, N = { C: C5, D: C5 * 1.1225, E: C5 * 1.26, G: C5 * 1.4983, A: C5 * 1.6818, c: C5 * 2, d: C5 * 2.245, e: C5 * 2.52 };
    const motifs = [['C', 'E', 'G', 'c', 'G', 'E'], ['E', 'G', 'A', 'e', 'c', 'A'], ['G', 'A', 'c', 'd', 'c', 'G'], ['A', 'G', 'E', 'D', 'E', 'C']];
    let step = 0;
    const loop = () => {
      const t = ctx.currentTime + 0.05, m = motifs[step % motifs.length], loud = Math.min(1, 0.6 + step * 0.06);
      if (step % 2 === 0) pad(t);
      m.forEach((k, i) => chime(N[k], t + i * 0.32, 0.42 * loud + (i === 0 ? 0.12 : 0)));
      if (step >= 3) chime(N[m[0]] / 2, t, 0.3 * loud, 3); // low octave joins after a few bars
      step++;
    };
    loop(); clearInterval(AL.timer); AL.timer = setInterval(loop, 4200);
  } catch (e) { console.warn('alarm audio', e); }
}
function stopAlarm() {
  $('#alarm').classList.remove('on'); clearInterval(AL.timer);
  const { ctx, master, nodes } = AL;
  if (ctx && master) { try { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime); master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2); } catch {} setTimeout(() => nodes.forEach(n => { try { n.disconnect(); } catch {} }), 2500); }
  AL.master = null;
}
function updAlarmText() {
  const n = new Date(); $('#al-time').textContent = hhmm(n);
  $('#al-date').textContent = n.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  const w = H.wx?.current, ev = (H.cal?.events || []).find(e => !e.allDay && new Date(e.start) > n && new Date(e.start) < new Date(+n + 864e5));
  $('#al-line').textContent = [w && w.temp != null ? `${Math.round(w.temp)}° ${(WXC[w.code] || [''])[0].toLowerCase()}` : '', ev ? `first up: ${ev.title} at ${hhmm(new Date(ev.start))}` : ''].filter(Boolean).join('  ·  ');
}
setInterval(() => { if (PW.alarmActive) updAlarmText(); }, 15000);
(function alarmSlide() {
  const track = $('#al-slide'), knob = $('#al-knob'); let id = null, sx = 0, dx = 0, max = 1;
  track.addEventListener('pointerdown', e => { AL.ctx?.resume?.(); if (!e.target.closest('#al-knob')) return; id = e.pointerId; sx = e.clientX; dx = 0; max = track.clientWidth - knob.clientWidth - 12; knob.style.transition = 'none'; try { knob.setPointerCapture(id); } catch {} });
  track.addEventListener('pointermove', e => { if (e.pointerId !== id) return; dx = Math.max(0, Math.min(max, e.clientX - sx)); knob.style.transform = `translateX(${dx}px)`; });
  const end = async () => {
    if (id === null) return; id = null;
    if (dx >= max * 0.85) {
      knob.style.transform = `translateX(${max}px)`; PW.alarmActive = false; stopAlarm();
      await jsend('/api/alarm/dismiss', 'POST').catch(() => {}); setTimeout(() => { knob.style.transform = ''; knob.style.transition = ''; }, 400);
      lastAct = Date.now();
    } else { knob.style.transition = 'transform .25s ease'; knob.style.transform = ''; }
  };
  track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);
})();
$('#alarm').addEventListener('pointerdown', () => AL.ctx?.resume?.());
pollPower(); setInterval(pollPower, 3000);

/* ---- start ---- */
setPage(0, false); tickClock(); setInterval(tickClock, 5000); shiftPx(); refreshHome();

// keep screen awake-friendly: block context menu / pinch zoom on kiosk
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
